<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-gray-100">

    <div class="flex h-screen">

      <!-- Sidebar -->
      <aside class="w-64 min-w-64 bg-orange-500 text-white flex flex-col h-screen sticky top-0">
        <div class="px-4 py-5 text-xl font-bold border-b border-white/20">
          🛍 Boutique
        </div>

        <!-- Liens nav -->
        <nav class="flex-1 p-3 space-y-1">
          <a href="produit.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/20 font-medium text-white text-sm">
            <i class="fas fa-box w-4"></i> Produits
          </a>
          <a href="utilisateur.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/15 text-white/85 hover:text-white text-sm transition">
            <i class="fas fa-users w-4"></i> Utilisateurs
          </a>

        </nav>

        <!-- Déconnexion en bas -->
        <div class="border-t border-white/20">
          <a href="#"
            class="flex items-center gap-3 px-4 py-4 text-white/85 hover:bg-white/15 hover:text-white text-sm transition">
            <i class="fas fa-sign-out-alt w-4"></i> Déconnexion
          </a>
        </div>
      </aside>

      <!-- Colonne principale -->
      <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Topbar -->
        <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm">
          <h1 class="text-base font-semibold text-gray-800">Produits</h1>
          <div class="flex items-center gap-3 text-sm text-gray-600">
            <span>Bonjour, <strong>Awa</strong></span>
            <img src="https://i.pravatar.cc/40" alt="avatar" class="w-9 h-9 rounded-full" />
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">

          <!-- Formulaire -->
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-5 pb-3 border-b-2 border-orange-200">
              Ajouter un produit
            </h2>

            <form id="produitForm" class="space-y-4">

              <!-- Ligne 1 : Nom + Catégorie -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Nom du produit</label>
                  <input type="text" id="produitNom" placeholder="Ex : Robe wax"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400" />
                  <p class="text-red-500 text-xs mt-1" id="error-produitNom"></p>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
                  <select id="produitCategorie"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 bg-white">
                    <option value="">-- Choisir --</option>
                    <option value="Vêtements">Vêtements</option>
                    <option value="Chaussures">Chaussures</option>
                    <option value="Accessoires">Accessoires</option>
                    <option value="Électronique">Électronique</option>
                    <option value="Alimentation">Alimentation</option>
                  </select>
                  <p class="text-red-500 text-xs mt-1" id="error-produitCategorie"></p>
                </div>
              </div>

              <!-- Ligne 2 : Prix + Stock -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Prix Unitaire (FCFA)</label>
                  <input type="number" id="produitPrix" placeholder="Ex : 15000" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400" />
                  <p class="text-red-500 text-xs mt-1" id="error-produitPrix"></p>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Quantité Stock</label>
                  <input type="number" id="produitStock" placeholder="Ex : 50" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400" />
                  <p class="text-red-500 text-xs mt-1" id="error-produitStock"></p>
                </div>
              </div>

              <!-- Ligne 3 : Description + Image sur la même ligne -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">

                <div class="flex flex-col h-full">
                  <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                  <textarea id="produitDescription" rows="6"
                    placeholder="Ex : Robe en tissu wax multicolore, taille unique..."
                    class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 resize-none"></textarea>
                </div>

                <div class="flex flex-col h-full">
                  <label class="block text-sm font-medium text-gray-700 mb-1">Image du produit</label>
                  <div id="dropZone"
                    class="flex-1 border-2 border-dashed border-orange-300 rounded-xl text-center cursor-pointer hover:border-orange-500 hover:bg-orange-50 transition flex flex-col items-center justify-center min-h-40"
                    onclick="document.getElementById('produitImage').click()">
                    <input type="file" id="produitImage" accept="image/*" class="hidden">
                    <div id="dropZoneContent" class="py-6">
                      <i class="fas fa-cloud-upload-alt text-3xl text-orange-400 mb-2"></i>
                      <p class="text-sm text-gray-500">
                        Glissez une image ou
                        <span class="text-orange-500 font-medium underline">parcourez</span>
                      </p>
                      <p class="text-xs text-gray-400 mt-1">PNG, JPG, WEBP — max 5 Mo</p>
                    </div>

                    <div id="previewContainer" class="hidden w-full p-3">
                      <img id="previewImg" src="" alt="preview"
                        class="mx-auto max-h-36 rounded-lg object-contain border border-gray-200" />
                      <button type="button" id="removeImg"
                        class="mt-2 text-xs text-red-500 hover:text-red-700 transition block mx-auto"
                        onclick="event.stopPropagation()">
                        <i class="fas fa-times mr-1"></i> Supprimer l'image
                      </button>
                    </div>
                  </div>
                  <p class="text-red-500 text-xs mt-1" id="error-produitImage"></p>
                </div>

              </div>

              <div class="flex justify-end pt-2">
                <button type="submit"
                  class="bg-orange-500 cursor-pointer hover:bg-orange-600 text-white font-medium text-sm px-6 py-2.5 rounded-lg transition shadow-sm">
                  <i class="fas fa-save mr-2 "></i> Enregistrer
                </button>
              </div>
            </form>
          </div>

          <!-- Tableau / Cards produits -->
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
              <h3 class="text-base font-semibold text-gray-800">Liste des produits</h3>
              <div class="flex gap-2">
                <button id="btnProduitList"
                  class="bg-orange-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg hover:bg-orange-600 transition">
                  Liste
                </button>
                <button id="btnProduitCard"
                  class="bg-gray-200 text-gray-700 text-sm font-medium px-4 py-1.5 rounded-lg hover:bg-gray-300 transition">
                  Cards
                </button>
              </div>
            </div>

            <!-- Vue liste -->
            <div id="produitTableWrapper" class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-orange-50 text-orange-900 text-xs uppercase font-semibold border-b border-orange-100">
                    <th class="px-4 py-3">Image</th>
                    <th class="px-4 py-3">Produit</th>
                    <th class="px-4 py-3">Catégorie</th>
                    <th class="px-4 py-3">Prix unitaire</th>
                    <th class="px-4 py-3 text-center">Quantite Stock</th>
                    <th class="px-4 py-3">Description</th>
                    <th class="px-4 py-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody id="produitTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                  <tr id="emptyProduitRow">
                    <td colspan="8" class="px-4 py-8 text-center text-gray-400 italic">
                      Aucun produit enregistré
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Vue cards -->
            <div id="produitCardContainer"
              class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-6">
            </div>
          </div>

        </main>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer"
        class="fixed top-5 right-5 space-y-3 z-50">
    </div>


    <script src="produit.js"></script>

  </body>
</html>
