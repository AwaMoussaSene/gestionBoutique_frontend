<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside
        class="w-64 min-w-64 bg-orange-500 text-white flex flex-col h-screen sticky top-0"
      >
        <div class="px-4 py-5 text-xl font-bold border-b border-white/20">
          🛍 Boutique
        </div>

        <!-- Liens nav -->
        <nav class="flex-1 p-3 space-y-1">
          <a
            href="produit.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/20 font-medium text-white text-sm"
          >
            <i class="fas fa-box w-4"></i> Produits
          </a>
          <a
            href="utilisateur.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/15 text-white/85 hover:text-white text-sm transition"
          >
            <i class="fas fa-users w-4"></i> Utilisateurs
          </a>
        </nav>

        <!-- Déconnexion en bas -->
        <div class="border-t border-white/20">
          <a
            href="#"
            class="flex items-center gap-3 px-4 py-4 text-white/85 hover:bg-white/15 hover:text-white text-sm transition"
          >
            <i class="fas fa-sign-out-alt w-4"></i> Déconnexion
          </a>
        </div>
      </aside>

      <!-- Colonne principale -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header
          class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm"
        >
          <h1 class="text-base font-semibold text-gray-800">Produits</h1>
          <div class="flex items-center gap-3 text-sm text-gray-600">
            <span>Bonjour, <strong>Awa</strong></span>
            <img
              src="https://i.pravatar.cc/40"
              alt="avatar"
              class="w-9 h-9 rounded-full"
            />
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">
          <!-- Formulaire -->

          <!-- button d'ajout produit -->
          <div class="flex justify-end mb-4">
            <button
              onclick="openModal()"
              class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition cursor-pointer"
            >
              <i class="fas fa-plus mr-2"></i>
              Ajouter produit
            </button>
          </div>
          <!-- Tableau / Cards produits -->
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
            <div
              class="flex items-center justify-between px-6 py-4 border-b border-gray-200"
            >
              <h3 class="text-base font-semibold text-gray-800">
                Liste des produits
              </h3>
              <div class="flex gap-2">
                <button
                  id="btnProduitList"
                  class="bg-orange-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg hover:bg-orange-600 transition cursor-pointer"
                >
                  Liste
                </button>
                <button
                  id="btnProduitCard"
                  class="bg-gray-200 text-gray-700 text-sm font-medium px-4 py-1.5 rounded-lg hover:bg-gray-300 transition cursor-pointer"
                >
                  Cards
                </button>
              </div>
            </div>

            <!-- Vue liste -->
            <div id="produitTableWrapper" class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr
                    class="bg-orange-50 text-orange-900 text-xs uppercase font-semibold border-b border-orange-100"
                  >
                    <th class="px-4 py-3">Image</th>
                    <th class="px-4 py-3">Produit</th>
                    <th class="px-4 py-3">Catégorie</th>
                    <th class="px-4 py-3">Prix unitaire</th>
                    <th class="px-4 py-3 text-center">Quantite Stock</th>
                    <th class="px-4 py-3">Description</th>
                    <th class="px-4 py-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody
                  id="produitTableBody"
                  class="divide-y divide-gray-100 text-sm text-gray-700"
                >
                  <tr id="emptyProduitRow">
                    <td
                      colspan="8"
                      class="px-4 py-8 text-center text-gray-400 italic"
                    >
                      Aucun produit enregistré
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Vue cards -->
            <div
              id="produitCardContainer"
              class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-6"
            ></div>
          </div>
        </main>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed top-5 right-5 space-y-3 z-50"></div>

    <!-- MODAL PRODUIT -->
    <div
      id="produitModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
    >
      <div class="bg-white w-full max-w-2xl rounded-xl shadow-lg p-6 relative">
        <!-- close -->
        <button
          onclick="closeModal()"
          class="absolute top-3 right-3 text-gray-500 hover:text-red-500 cursor-pointer"
        >
          <i class="fas fa-times"></i>
        </button>

        <h2 id="modalTitle" class="text-lg font-semibold mb-4 ">
          Ajouter un produit
        </h2>

        <form id="produitForm" class="space-y-4">
          <input type="hidden" id="produitId" />

          <!-- NOM PRODUIT -->
          <div>
            <input
              id="produitNom"
              placeholder="Nom du produit"
              class="border p-2 rounded-lg w-full"
            />
            <p id="error-produitNom" class="text-red-500 text-xs"></p>
          </div>

          <!-- CATEGORIE -->
          <div>
            <select id="produitCategorie" class="border p-2 rounded-lg w-full">
              <option value="">Catégorie</option>
              <option>Vêtements</option>
              <option>Chaussures</option>
              <option>Accessoires</option>
            </select>
            <p id="error-produitCategorie" class="text-red-500 text-xs"></p>
          </div>

          <!-- PRIX + STOCK -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <input
                id="produitPrix"
                type="number"
                placeholder="Prix"
                class="border p-2 rounded-lg w-full"
              />
              <p id="error-produitPrix" class="text-red-500 text-xs"></p>
            </div>

            <div>
              <input
                id="produitStock"
                type="number"
                placeholder="Stock"
                class="border p-2 rounded-lg w-full"
              />
              <p id="error-produitStock" class="text-red-500 text-xs"></p>
            </div>
          </div>

          <!-- DESCRIPTION -->
          <div>
            <textarea
              id="produitDescription"
              class="border p-2 rounded-lg w-full"
              placeholder="Description"
            ></textarea>
            <p id="error-produitDescription" class="text-red-500 text-xs"></p>
          </div>

          <!-- IMAGE -->
          <div>
            <input
              type="file"
              id="produitImage"
              accept="image/*"
              class="border p-2 rounded-lg w-full"
            />

            <p id="error-produitImage" class="text-red-500 text-xs mt-1"></p>

            <!-- Prévisualisation -->
            <div id="previewContainer" class="mt-3 hidden">
              <img
                id="previewImage"
                src=""
                class="w-40 h-40 object-cover rounded-lg border"
              />
            </div>
          </div>

          <div class="flex justify-end gap-2">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 bg-gray-200 rounded-lg cursor-pointer"
            >
              Annuler
            </button>

            <button
              type="submit"
              class="px-4 py-2 bg-orange-500 text-white rounded-lg cursor-pointer"
            >
              Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- CONFIRM DELETE MODAL -->
    <div
      id="deleteModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
    >
      <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Confirmation</h2>

        <p class="text-gray-600 mb-5">
          Voulez-vous vraiment supprimer ce produit ?
        </p>

        <div class="flex justify-end gap-2">
          <button
            onclick="closeDeleteModal()"
            class="px-4 py-2 bg-gray-200 rounded-lg cursor-pointer"
          >
            Annuler
          </button>

          <button
            onclick="confirmDelete()"
            class="px-4 py-2 bg-red-500 text-white rounded-lg cursor-pointer"
          >
            Supprimer
          </button>
        </div>
      </div>
    </div>
    <script src="produit.js"></script>
  </body>
</html>
